# FinanceHub — the only publicly bound process on the box.
#
# Serves the built SPA and reverse-proxies the reporting gateway so the
# dashboard calls it same-origin. Same shape as frontend/nginx.conf, retargeted
# from a container name to loopback and from :3000 to :80.
#
# Installed to /etc/nginx/sites-available/financehub by deploy/provision.sh.

upstream financehub_reporting {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/financehub;
    index index.html;

    # Reports are PDFs and a seeded exception list can be large.
    client_max_body_size 25m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Nothing here should be framed or sniffed. Not a substitute for TLS —
    # add HSTS once certbot has run.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Hashed build assets are immutable; index.html must never be cached, or a
    # deploy leaves browsers pointing at asset names that no longer exist.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # The gateway. Only these prefixes are proxied: /health, /stats and /audit
    # are operational surfaces that have no business being public.
    location ~ ^/(metrics|exceptions|reports|auth) {
        proxy_pass http://financehub_reporting;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # PDF generation is synchronous and can outlast the 60s default.
        proxy_read_timeout 120s;
    }

    # Live exception notifications (WS /ws/exceptions).
    location /ws/ {
        proxy_pass http://financehub_reporting;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # A quiet queue is normal; the default 60s would drop the socket and
        # the dashboard would reconnect in a loop all day.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA fallback — client-side routes are not files on disk.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
